<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .you { fill: #fff8c5; stroke: #d4a72c; }
    .out { fill: #dafbe1; stroke: #4ac26b; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12px; }
    .a { stroke: #8c959f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .ah { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .you { fill: #2e2a12; stroke: #9e6a03; }
      .out { fill: #12261a; stroke: #2ea043; }
      .t { fill: #e6edf3; } .s { fill: #9198a1; }
      .a { stroke: #656c76; } .ah { fill: #656c76; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>

  <rect class="box you" x="10" y="40" width="150" height="76" rx="10"/>
  <text class="t" x="85" y="72" text-anchor="middle">Your .pkg</text>
  <text class="s" x="85" y="94" text-anchor="middle">the game you own</text>

  <rect class="box" x="200" y="40" width="150" height="76" rx="10"/>
  <text class="t" x="275" y="72" text-anchor="middle">Unpack + decrypt</text>
  <text class="s" x="275" y="94" text-anchor="middle">pkg_extract, RPCS3</text>

  <rect class="box" x="390" y="40" width="170" height="76" rx="10"/>
  <text class="t" x="475" y="72" text-anchor="middle">Lift PPU + SPU</text>
  <text class="s" x="475" y="94" text-anchor="middle">PowerPC / SPU → C++</text>

  <rect class="box" x="600" y="40" width="150" height="76" rx="10"/>
  <text class="t" x="675" y="72" text-anchor="middle">Compile</text>
  <text class="s" x="675" y="94" text-anchor="middle">ps3recomp runtime</text>

  <rect class="box out" x="790" y="10" width="160" height="50" rx="10"/>
  <text class="t" x="870" y="41" text-anchor="middle">Mac</text>
  <rect class="box out" x="790" y="70" width="160" height="50" rx="10"/>
  <text class="t" x="870" y="101" text-anchor="middle">iPad / iPhone</text>
  <rect class="box out" x="790" y="130" width="160" height="50" rx="10"/>
  <text class="t" x="870" y="161" text-anchor="middle">Apple TV</text>

  <path class="a" d="M160,78 L196,78"/>
  <path class="a" d="M350,78 L386,78"/>
  <path class="a" d="M560,78 L596,78"/>
  <path class="a" d="M750,70 C770,60 770,40 786,36"/>
  <path class="a" d="M750,82 L786,92"/>
  <path class="a" d="M750,94 C770,110 770,150 786,152"/>

  <text class="s" x="10" y="230">Everything runs on your Mac. The repository holds no game data, no keys and no firmware:</text>
  <text class="s" x="10" y="250">the game comes from your package, decryption from your RPCS3, the audio decoders from the firmware you installed in it.</text>
</svg>
